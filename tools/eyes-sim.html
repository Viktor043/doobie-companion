<title>Wearable Eyes Sim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: device on the left, sensor bench on the right; stacks on phones. Single dark look: it's an AMOLED. */
:root {
  --bg: #0b0d10; --panel: #14181d; --line: #252b33; --fg: #e6ebf0; --dim: #8a96a3;
  --mint: #50ffd2; --pink: #ff4678; --amber: #ffc24b;
  --display: "Space Grotesk", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--mono); font-size: 13px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 32px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--dim); }
.device { display: grid; place-items: center; gap: 14px; }
.bezel { width: min(100%, 320px); aspect-ratio: 300 / 476; max-width: 100%; border-radius: 34px; padding: 10px; background: radial-gradient(circle at 30% 25%, #3a4048, #15181c 60%, #0a0b0d); box-shadow: 0 30px 60px -20px #000, inset 0 2px 3px #ffffff22, inset 0 -6px 12px #00000099; box-sizing: border-box; position: relative; }
canvas#screen { width: 100%; height: 100%; border-radius: 26px; display: block; background: #000; cursor: pointer; touch-action: none; }
.readout { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; text-align: center; min-height: 2.6em; }
.readout b { color: var(--mint); font-weight: 600; }
.bench { display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); }
.pad { aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: 12px; background: repeating-linear-gradient(0deg, transparent 0 23px, var(--line) 23px 24px), repeating-linear-gradient(90deg, transparent 0 23px, var(--line) 23px 24px), #0f1216; position: relative; touch-action: none; cursor: grab; }
.knob { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 18px var(--mint); left: 50%; top: 50%; pointer-events: none; }
.btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
button { font: inherit; color: var(--fg); background: #1b2128; border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; }
button span { color: var(--dim); font-size: 11px; }
button:hover { border-color: var(--mint); }
button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.hint { color: var(--dim); line-height: 1.5; margin: 0; }
kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--fg); }
</style>

<div class="wrap">
  <header>
    <h1>Wearable Eyes Sim</h1>
    <span class="sub">Waveshare ESP32-S3-Touch-AMOLED-1.64 · 280×456 · QMI8658 + FT3168</span>
  </header>

  <section class="device">
    <div class="bezel"><canvas id="screen" width="280" height="456" aria-label="Simulated AMOLED showing animated eyes. Click to tap, hold to pet."></canvas></div>
    <div class="readout" id="readout"></div>
  </section>

  <aside class="bench">
    <div class="card">
      <div class="label">Tilt (QMI8658 accel)</div>
      <div class="pad" id="pad"><div class="knob" id="knob"></div></div>
      <p class="hint">Drag to tilt the wearable. Release and it springs back to flat.</p>
    </div>
    <div class="card">
      <div class="label">Sensor events</div>
      <div class="btns">
        <button id="b-shake">Shake<span>gyro burst → dizzy</span></button>
        <button id="b-bump">Bump<span>2.5 g spike → surprised</span></button>
        <button id="b-drop">Drop<span>free-fall → panic</span></button>
        <button id="b-flip">Flip<span>upside down → annoyed</span></button>
        <button id="b-still">Leave it<span>skip 45 s still → sleep</span></button>
        <button id="b-trick">Trick<span>roll · wink · cross · side-eye</span></button>
      </div>
      <p class="hint">On the screen: <kbd>click</kbd> = tap (happy + blush), <kbd>hold</kbd> 0.7 s = pet (hearts). Tapping while it sleeps makes it grumpy.</p>
    </div>
  </aside>
</div>

<script>
// Port of the firmware's eye engine (eyes.ino): same moods, tweens, spring and timers.
const cv = document.getElementById('screen'), g = cv.getContext('2d');
const W = 280, H = 456;
const rand = (a, b) => a + Math.floor(Math.random() * (b - a));
const approach = (c, t, rate, dt) => c + (t - c) * (1 - Math.exp(-rate * dt));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const MOOD = { NEUTRAL:0, HAPPY:1, SLEEPY:2, ANGRY:3, SAD:4, SURPRISED:5, SUSPICIOUS:6, PANIC:7 };
const MOODNAME = Object.keys(MOOD);
const SP = { NONE:0, LOVE:1, DIZZY:2, ASLEEP:3 };
const SPNAME = ['—', 'love', 'dizzy', 'asleep'];

function moodShape(m, left) {
  switch (m) {
    case MOOD.HAPPY:      return {w:120,h:150,r:50,lidTop:0,   lidBot:.58,slant:0};
    case MOOD.SLEEPY:     return {w:120,h:140,r:40,lidTop:.55, lidBot:.10,slant:-.15};
    case MOOD.ANGRY:      return {w:115,h:140,r:34,lidTop:.38, lidBot:0,  slant:.75};
    case MOOD.SAD:        return {w:110,h:140,r:40,lidTop:.30, lidBot:0,  slant:-.70};
    case MOOD.SURPRISED:  return {w:135,h:175,r:66,lidTop:0,   lidBot:0,  slant:0};
    case MOOD.SUSPICIOUS: return left ? {w:120,h:140,r:34,lidTop:.5,lidBot:.2,slant:.2}
                                      : {w:115,h:150,r:40,lidTop:.1,lidBot:0, slant:0};
    case MOOD.PANIC:      return {w:80, h:95, r:46,lidTop:0,   lidBot:0,  slant:0};
    default:              return {w:115,h:150,r:40,lidTop:0,   lidBot:0,  slant:0};
  }
}
function tween(c, t, dt, rate) { for (const k in t) c[k] = approach(c[k], t[k], rate, dt); }

// ---- state
let curL = moodShape(0, true), curR = moodShape(0, false);
let mood = 0, moodUntil = 0, baseMood = 0, special = SP.NONE, specialUntil = 0;
let blush = 0, blushT = 0;
let gazeX = 0, gazeY = 0, gvX = 0, gvY = 0, glanceX = 0, glanceY = 0;
let converge = 0, convergeT = 0, rollPhase = -1;
let blinkT = -1, blinkWhich = 0, nextBlink = 2000, nextGlance = 1500, nextTrick = 9000;
let shakeEnergy = 0, gravX = 0, gravY = 0, gravZ = 1, lastMotion = 0, freefallStart = 0;
let touchDown = false, wasTouch = false, touchStart = 0, asleep = false, bright = 1, brightT = 1;
let simClock = 0;              // ms, can be fast-forwarded
const now = () => simClock;

// ---- simulated sensors
let tilt = {x:0, y:0}, flipped = false, events = [];
function imu() {
  const t = now();
  let ax = tilt.x, ay = tilt.y, az = Math.sqrt(Math.max(0, 1 - ax*ax - ay*ay)) * (flipped ? -1 : 1);
  let gyro = 0;
  events = events.filter(e => t < e.until);
  for (const e of events) {
    if (e.kind === 'shake') { const p = (e.until - t) / 1200; ax += Math.sin(t / 22) * 1.6 * p; ay += Math.cos(t / 17) * 1.2 * p; gyro += 420 * p; }
    if (e.kind === 'bump')  { ax += 0.4; az += 1.6; }
    if (e.kind === 'drop')  { ax = ay = az = 0.05; }
  }
  return {ax, ay, az, gyro};
}

function setMood(m, ms) { mood = m; moodUntil = ms ? now() + ms : 0; }
function setSpecial(s, ms) { special = s; specialUntil = now() + ms; }
function wake(m) { if (asleep) { asleep = false; special = SP.NONE; setMood(m, 1500); } baseMood = 0; lastMotion = now(); }

let lastA = {ax:0, ay:0, az:1, gyro:0};
function behave(dt) {
  const t = now();
  const {ax, ay, az, gyro} = lastA = imu();
  const amag = Math.hypot(ax, ay, az);
  gravX = approach(gravX, ax, 6, dt); gravY = approach(gravY, ay, 6, dt); gravZ = approach(gravZ, az, 6, dt);
  const jerk = Math.abs(amag - 1) + gyro / 900;
  shakeEnergy = shakeEnergy * Math.exp(-2.5 * dt) + jerk * dt * 8;
  if (jerk > 0.08) { if (asleep && jerk > 0.25) wake(MOOD.SURPRISED); lastMotion = t; }

  if (amag < 0.35) { if (!freefallStart) freefallStart = t; } else freefallStart = 0;
  if (freefallStart && t - freefallStart > 60) { setMood(MOOD.PANIC, 900); wake(MOOD.PANIC); }

  if (shakeEnergy > 3.2 && special !== SP.DIZZY) { setSpecial(SP.DIZZY, 2600); shakeEnergy = 0; wake(0); }
  else if (amag > 2.3 && special === SP.NONE && mood !== MOOD.SURPRISED) { setMood(MOOD.SURPRISED, 900); blinkT = -1; }

  if (touchDown && !wasTouch) touchStart = t;
  if (touchDown && t - touchStart > 700 && special !== SP.LOVE) {
    if (asleep) wake(MOOD.ANGRY); else { setSpecial(SP.LOVE, 2500); blushT = 1; }
  }
  if (!touchDown && wasTouch && t - touchStart < 700) {
    if (asleep) wake(MOOD.ANGRY); else { setMood(MOOD.HAPPY, 1600); blushT = 1; }
    lastMotion = t;
  }
  wasTouch = touchDown;

  if (gravZ < -0.75 && special === SP.NONE && !asleep) baseMood = MOOD.ANGRY;
  else if (baseMood === MOOD.ANGRY) baseMood = 0;

  const still = t - lastMotion;
  if (!asleep && still > 45000) { asleep = true; special = SP.ASLEEP; specialUntil = Infinity; }
  else if (!asleep && still > 20000 && baseMood === 0) baseMood = MOOD.SLEEPY;
  else if (still < 20000 && baseMood === MOOD.SLEEPY) baseMood = 0;
  brightT = asleep ? 0.16 : 1;

  if (moodUntil && t > moodUntil) { mood = baseMood; moodUntil = 0; }
  if (!moodUntil) mood = baseMood;
  if (special !== SP.NONE && special !== SP.ASLEEP && t > specialUntil) {
    if (special === SP.DIZZY) setMood(MOOD.ANGRY, 1400);
    special = SP.NONE;
  }
  blushT = approach(blushT, 0, 0.9, dt);
  blush = approach(blush, blushT > 0.3 ? 1 : 0, 8, dt);

  if (blinkT >= 0) { blinkT += dt; if (blinkT > 0.16) blinkT = -1; }
  if (t > nextBlink && special === SP.NONE) { blinkT = 0; blinkWhich = 0; nextBlink = t + (rand(0, 10) === 0 ? 220 : rand(1800, 5500)); }
  if (t > nextGlance) { const c = rand(0, 3) === 0; glanceX = c ? 0 : rand(-55, 56); glanceY = c ? 0 : rand(-30, 31); nextGlance = t + rand(900, 3200); }
  if (t > nextTrick && special === SP.NONE && !asleep && mood === baseMood) { doTrick(rand(0, 5)); nextTrick = t + rand(9000, 22000); }
  if (convergeT > 0) { converge = approach(converge, convergeT, 6, dt); if (converge > convergeT - 1) convergeT = -1; }
  else converge = approach(converge, 0, 3, dt);

  let tx = gravX * 130 + glanceX, ty = gravY * 110 + glanceY;
  if (rollPhase >= 0) {
    rollPhase += dt; const a = rollPhase * 2 * Math.PI / 1.1 - Math.PI / 2;
    tx = Math.cos(a) * 70; ty = Math.sin(a) * 55 - 15; if (rollPhase > 1.1) rollPhase = -1;
  }
  tx = clamp(tx, -120, 120); ty = clamp(ty, -100, 100);
  gvX += (tx - gazeX) * 220 * dt; gvY += (ty - gazeY) * 220 * dt;
  const damp = Math.exp(-16 * dt); gvX *= damp; gvY *= damp; gazeX += gvX * dt; gazeY += gvY * dt;

  tween(curL, moodShape(mood, true), dt, 10); tween(curR, moodShape(mood, false), dt, 10);
  bright = approach(bright, brightT, brightT > bright ? 10 : 2, dt);
}
function doTrick(k) {
  if (k === 0) rollPhase = 0;
  if (k === 1) { blinkT = 0; blinkWhich = 1; }
  if (k === 2) convergeT = 38;
  if (k === 3) { setMood(MOOD.SUSPICIOUS, 2200); glanceX = 70; }
  if (k === 4) setMood(MOOD.HAPPY, 1200);
}

// ---- drawing: grainy teal gradient + halftone dot-art eyes (mirrors eyes.ino)
const PITCH = 9, DOT_R = 3.9, SCALE = 0.72, GAZE_KX = 0.40, GAZE_KY = 1.05;
const C_INK = '#04262c', C_PINK = '#ff5c8c', C_RED = '#e81e54';
const clampf = (v, a, b) => v < a ? a : v > b ? b : v;
function hash32(x) { x ^= x >>> 16; x = Math.imul(x, 0x7feb352d); x ^= x >>> 15; x = Math.imul(x, 0x846ca68b); x ^= x >>> 16; return x >>> 0; }
const bgFrames = [];
for (let f = 0; f < 3; f++) {
  const img = g.createImageData(W, H), d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = clampf((x * 0.35 + y) / (W * 0.35 + H), 0, 1);
    const gx = (x - W * 0.3) / W, gy = (y - H * 0.22) / H, glow = Math.exp(-(gx*gx + gy*gy) * 6);
    let r = 18 - 18 * t + 70 * glow, gg = 236 + (168 - 236) * t + 18 * glow, b = 214 + (178 - 214) * t + 30 * glow;
    const dx = (x % PITCH) - (PITCH >> 1), dy = (y % PITCH) - (PITCH >> 1);
    if (dx*dx + dy*dy <= 2) { r *= .88; gg *= .9; b *= .9; }
    const n = ((hash32(x * 7919 + y * 104729 + f * 15485863) & 255) / 255 - 0.5) * 34;
    const i = (y * W + x) * 4; d[i] = r + n; d[i+1] = gg + n; d[i+2] = b + n; d[i+3] = 255;
  }
  bgFrames.push(img);
}
const sdBox = (px, py, hw, hh, r) => { const qx = Math.abs(px) - (hw - r), qy = Math.abs(py) - (hh - r); return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; };
const sdEllipse = (px, py, rx, ry) => (Math.sqrt(px*px/(rx*rx) + py*py/(ry*ry)) - 1) * Math.min(rx, ry);
const sdCircle = (px, py, r) => Math.hypot(px, py) - r;
function dotField(cx, cy, hw, hh, col, sdf) {
  g.fillStyle = col;
  const h2 = PITCH >> 1;
  const x0 = Math.max(Math.floor((cx - hw) / PITCH) * PITCH + h2, h2), x1 = Math.min(cx + hw + PITCH, W);
  const y0 = Math.max(Math.floor((cy - hh) / PITCH) * PITCH + h2, h2), y1 = Math.min(cy + hh + PITCH, H);
  g.beginPath();
  for (let y = y0; y < y1; y += PITCH) for (let x = x0; x < x1; x += PITCH) {
    const c = clampf(0.5 - sdf(x - cx, y - cy) / (PITCH * 1.1), 0, 1);
    if (c <= 0.08) continue;
    const r = Math.max(1, Math.round(DOT_R * Math.sqrt(c)));
    g.moveTo(x + r, y); g.arc(x, y, r, 0, Math.PI * 2);
  }
  g.fill();
}
function drawEye(cx, cy, e0, squash, isLeft) {
  const ew = e0.w * SCALE, eh = e0.h * SCALE, er = e0.r * SCALE;
  const h = eh * (1 - squash) + 7 * squash, w = ew * (1 + 0.12 * squash), r = Math.min(er, Math.min(w, h) / 2);
  const lid = e0.lidTop > 0.01 || Math.abs(e0.slant) > 0.01, s = e0.slant * h * 0.35;
  const base = -h / 2 + e0.lidTop * h, slope = (isLeft ? 2 * s : -2 * s) / w, norm = 1 / Math.sqrt(1 + slope * slope);
  const ery = h * 0.62, erx = w * 0.85, ecy = h / 2 + ery - e0.lidBot * h * 1.15;
  dotField(cx, cy, w / 2 + 4, h / 2 + 4, C_INK, (x, y) => {
    let d = sdBox(x, y, w / 2, h / 2, r);
    if (lid) d = Math.max(d, ((base + slope * x) - y) * norm);
    if (e0.lidBot > 0.01) d = Math.max(d, -sdEllipse(x, y - ecy, erx, ery));
    return d;
  });
}
function heart(cx, cy, u, col) {
  const k = Math.SQRT1_2, hs = u * 0.62;
  dotField(cx, cy, u * 1.3, u * 1.3, col, (x, y) => {
    const py = y - u * 0.15, rx = (x + py) * k, ry = (py - x) * k;
    return Math.min(sdBox(rx, ry, hs, hs, 2), sdCircle(x + hs * k, py + hs * k, hs), sdCircle(x - hs * k, py + hs * k, hs));
  });
}
function spiral(cx, cy, t, size) {
  const b = size / (2.2 * Math.PI);
  dotField(cx, cy, size, size, C_INK, (x, y) => {
    const rr = Math.hypot(x, y), th = Math.atan2(y, x) + t * 7, u = rr / (2 * Math.PI * b) - th / (2 * Math.PI), f = u - Math.floor(u);
    return Math.max(Math.min(f, 1 - f) * 2 * Math.PI * b - 3.5, rr - size);
  });
}
let gf = 0, gfT = 0;
function render(t) {
  if (performance.now() - gfT > 90) { gfT = performance.now(); gf = (gf + 1) % 3; }
  g.putImageData(bgFrames[gf], 0, 0);
  const cx = W / 2, cy = H / 2 - 10, sep = 66, bob = Math.sin(t * 1.7) * 3, cvg = converge * 0.6;
  const lx = cx - sep + gazeX * GAZE_KX + cvg, rx = cx + sep + gazeX * GAZE_KX - cvg, ly = cy + gazeY * GAZE_KY + bob, ry = ly;
  let sqL = 0, sqR = 0;
  if (blinkT >= 0) { const p = blinkT / 0.16, s = p < 1 ? Math.sin(p * Math.PI) : 0; if (blinkWhich !== 2) sqL = s; if (blinkWhich !== 1) sqR = s; }
  if (special === SP.LOVE) { const p = 1 + 0.12 * Math.sin(t * 10); heart(lx, ly, 40 * p, C_RED); heart(rx, ry, 40 * p, C_RED); }
  else if (special === SP.DIZZY) { spiral(lx, ly, t, 46); spiral(rx, ry, -t, 46); }
  else if (special === SP.ASLEEP) {
    dotField(lx, ly, 44, 8, C_INK, (x, y) => sdBox(x, y, 40, 4, 4)); dotField(rx, ry, 44, 8, C_INK, (x, y) => sdBox(x, y, 40, 4, 4));
    g.fillStyle = C_INK;
    for (const off of [0, 0.5]) { const z = (t * 0.6 + off) % 1; if (z < 0.85) { g.font = `700 ${12 + z * 24}px ui-monospace, monospace`; g.fillText('z', rx + 20 + z * 30, ry - 30 - z * 110); } }
  } else { drawEye(lx, ly, curL, sqL, true); drawEye(rx, ry, curR, sqR, false); }
  if (blush > 0.05) {
    const ry2 = 12 * blush, rx2 = 30 * blush;
    dotField(lx - 8, ly + 82, rx2 + 4, ry2 + 4, C_PINK, (x, y) => sdEllipse(x, y, rx2, ry2));
    dotField(rx + 8, ry + 82, rx2 + 4, ry2 + 4, C_PINK, (x, y) => sdEllipse(x, y, rx2, ry2));
  }
  if (bright < 0.98) { g.fillStyle = `rgba(0,0,0,${1 - bright})`; g.fillRect(0, 0, W, H); }
}

// ---- loop
const readout = document.getElementById('readout');
let last = performance.now(), logT = 0;
function frame(p) {
  const dt = clamp((p - last) / 1000, 0.001, 0.05); last = p; simClock += dt * 1000;
  behave(dt); render(simClock / 1000);
  if (p - logT > 150) {
    logT = p; const a = lastA;
    readout.innerHTML = `a = <b>${a.ax.toFixed(2)}, ${a.ay.toFixed(2)}, ${a.az.toFixed(2)}</b> g · shake <b>${shakeEnergy.toFixed(2)}</b><br>mood <b>${MOODNAME[mood].toLowerCase()}</b> · special <b>${SPNAME[special]}</b> · still ${((now() - lastMotion)/1000).toFixed(0)} s`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- inputs
cv.addEventListener('pointerdown', e => { touchDown = true; cv.setPointerCapture(e.pointerId); });
const up = () => { touchDown = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

const pad = document.getElementById('pad'), knob = document.getElementById('knob');
let dragging = false;
function setTilt(e) {
  const r = pad.getBoundingClientRect();
  let x = ((e.clientX - r.left) / r.width) * 2 - 1, y = ((e.clientY - r.top) / r.height) * 2 - 1;
  const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  tilt = {x: x * 0.85, y: y * 0.85};
  knob.style.left = (50 + x * 50) + '%'; knob.style.top = (50 + y * 50) + '%';
  lastMotion = now(); if (asleep) wake(MOOD.SURPRISED);
}
pad.addEventListener('pointerdown', e => { dragging = true; pad.setPointerCapture(e.pointerId); setTilt(e); });
pad.addEventListener('pointermove', e => { if (dragging) setTilt(e); });
const release = () => { dragging = false; tilt = {x:0, y:0}; knob.style.left = knob.style.top = '50%'; };
pad.addEventListener('pointerup', release); pad.addEventListener('pointercancel', release);

const ev = (kind, ms) => events.push({kind, until: now() + ms});
document.getElementById('b-shake').onclick = () => ev('shake', 1200);
document.getElementById('b-bump').onclick  = () => ev('bump', 60);
document.getElementById('b-drop').onclick  = () => ev('drop', 350);
document.getElementById('b-flip').onclick  = e => { flipped = !flipped; lastMotion = now(); e.currentTarget.firstChild.textContent = flipped ? 'Flip back' : 'Flip'; };
document.getElementById('b-still').onclick = () => { lastMotion = now() - 46000; };
document.getElementById('b-trick').onclick = () => { if (!asleep) { special = SP.NONE; doTrick(rand(0, 5)); } };
</script>
